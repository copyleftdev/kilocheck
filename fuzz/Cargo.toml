[package]
name = "kilo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
kilo-core = { path = "../crates/kilo-core" }
libfuzzer-sys = "0.4"

[[bin]]
name = "target_parse"
path = "fuzz_targets/target_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false
